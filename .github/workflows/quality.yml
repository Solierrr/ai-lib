name: Code Quality

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        run: |
          python -m pip install --only-binary=:all: uv==0.12.22

      - name: Install dependencies
        run: uv sync --frozen --no-build --extra dev

      - name: Lint
        run: |
          uv run --frozen --no-build ruff check .
          uv run --frozen --no-build ruff format --check .
