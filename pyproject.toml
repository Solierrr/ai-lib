[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "solaria-lib"
version = "0.1.1"
description = "Shared building blocks for the Solaria AI services"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Solierrr" }]
dependencies = [
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "langchain-core>=1.0,<2",
  "langchain-google-genai>=3,<5",
  "langchain-groq>=1,<2",
  "langgraph>=1.0,<2",
  "pyjwt[crypto]>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "respx>=0.22",
  "ruff>=0.8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
